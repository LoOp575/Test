name: Crypto Intelligence v2 tests

on:
  push:
    branches:
      - audit/crypto-intelligence-v2-ci
    paths:
      - "backend/crypto_intelligence_v2.py"
      - "backend/tests/test_crypto_intelligence_v2.py"
      - ".github/workflows/crypto-intelligence-v2-tests.yml"
  pull_request:
    paths:
      - "backend/crypto_intelligence_v2.py"
      - "backend/tests/test_crypto_intelligence_v2.py"
      - ".github/workflows/crypto-intelligence-v2-tests.yml"

permissions:
  contents: read

jobs:
  crypto-intelligence-v2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Run Crypto Intelligence v2 tests
        run: python -m pytest -q backend/tests/test_crypto_intelligence_v2.py
